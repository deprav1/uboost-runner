[Service]
UMask=0077
# На этом VPS IPv4-маршрут к api.telegram.org таймаутится, IPv6 стабилен.
# Ограничение применяется только к Telegram-клиенту внутри server.js.
Environment=TELEGRAM_IP_FAMILY=6
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/opt/uboost/backend/data /opt/uboost/backups
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
LockPersonality=true
RestrictRealtime=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
CapabilityBoundingSet=
