<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>ЮБуст Раннер — лети по рунету</title>

  <!-- OG / превью при шеринге ссылки -->
  <meta property="og:title" content="ЮБуст Раннер">
  <meta property="og:description" content="Уворачивайся от блокировок, капч и рекламы. Лови ВПН-буст. Набей рекорд!">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#000000">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@500;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <button id="btn-mute" aria-label="Звук">🔊</button>

    <div id="ui-layer">
      <!-- Старт -->
      <div id="start-screen" class="screen">
        <div class="panel">
          <div class="logo"><span class="logo-mark">U</span><span class="logo-word">ЮБуст</span></div>
          <h1 id="title" class="glitch">ЮБУСТ РАННЕР</h1>
          <p id="tagline" class="tagline"></p>
          <button id="btn-start" class="btn primary">ПОЕХАЛИ</button>
          <p id="howto" class="hint"></p>
        </div>
      </div>

      <!-- Game Over -->
      <div id="game-over-screen" class="screen hidden">
        <div class="panel">
          <span id="record-badge" class="badge hidden">★ НОВЫЙ РЕКОРД ★</span>
          <h1 id="gameover-title">ИНТЕРНЕТ ВСЁ</h1>
          <p id="death-line" class="death"></p>
          <p id="final-score" class="final"></p>
          <div id="card-preview" class="card-preview"></div>
          <div id="stats">
            <p class="stats-head">Ты пережил:</p>
            <ul id="stats-list"></ul>
          </div>
          <button id="btn-share" class="btn">ПОХВАСТАТЬСЯ</button>
          <button id="btn-restart" class="btn">ЕЩЁ РАЗ</button>
          <button id="btn-uboost" class="btn cta">ВКЛЮЧИТЬ НАСТОЯЩИЙ ЮБУСТ</button>
        </div>
      </div>

      <!-- HUD -->
      <div id="hud" class="hidden">
        <div class="hud-top">
          <span id="score-display">0</span>
          <div class="hud-right">
            <span id="dist-display">0 м</span>
            <div id="lives-display"></div>
          </div>
        </div>
        <div id="combo-display"></div>
        <div id="boost-indicator" class="hidden">
          <span class="boost-label">⚡ ВПН БУСТ</span>
          <div class="boost-track"><div id="boost-bar"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
