<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>ЮБуст Раннер — лети по рунету</title>

  <!-- OG / превью при шеринге ссылки. og:image обязателен: без него Telegram
       разворачивает challenge-ссылку без картинки и теряется главный виральный
       крючок. URL абсолютный (Telegram/соцсети не резолвят относительные пути). -->
  <meta property="og:title" content="ЮБуст Раннер">
  <meta property="og:description" content="Уворачивайся от блокировок, капч и рекламы, долети до финиша — получи реальный ВПН. Набей рекорд!">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://deprav1.github.io/uboost-runner/">
  <meta property="og:image" content="https://deprav1.github.io/uboost-runner/preview/share-card.png">
  <meta property="og:image:width" content="1080">
  <meta property="og:image:height" content="1080">
  <meta property="og:image:alt" content="ЮБуст Раннер — синтвейв-забег по рунету">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#000000">

  <!-- Фирменный шрифт Open Runde — self-hosted, без внешнего CDN (надёжнее в Telegram
       WebApp и без сетевой зависимости от Google Fonts). Префетчим ходовые веса. -->
  <link rel="preload" href="assets/fonts/OpenRunde-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/OpenRunde-Semibold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/style.css?v=panel-audit-1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <button id="btn-mute" aria-label="Звук">🔊</button>
    <button id="btn-pause" class="hidden" aria-label="Пауза">⏸</button>
    <button id="btn-settings" aria-label="Настройки">⚙</button>

    <div id="ui-layer">
      <!-- Старт -->
      <div id="start-screen" class="screen">
        <video class="start-bg-video" poster="assets/start/start-bg-wide.webp" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
          <source src="assets/start/start-bg-video.mp4" type="video/mp4">
        </video>
        <div class="panel">
          <div class="logo"><span class="logo-mark">u</span><span class="logo-word">ЮБуст</span></div>
          <h1 id="title" class="glitch">ЮБУСТ РАННЕР</h1>
          <p id="tagline" class="tagline"></p>
          <p id="challenge-banner" class="challenge hidden"></p>
          <p id="mission-preview" class="mission-preview"></p>
          <div id="difficulty-row" class="difficulty-row">
            <span id="difficulty-title" class="difficulty-label">Сложность</span>
            <div class="difficulty-options">
              <button id="diff-easy" class="btn toggle diff-btn">ЛЕГКО</button>
              <button id="diff-normal" class="btn toggle diff-btn">ОБЫЧНО</button>
              <button id="diff-hard" class="btn toggle diff-btn">ХАРДКОР</button>
            </div>
          </div>
          <p id="howto" class="hint hint-pre"></p>
          <button id="btn-start" class="btn primary">ПОЕХАЛИ</button>
          <p id="rank-display" class="rank-line rank-line-start"></p>
          <p id="best-display" class="rank-line rank-line-start hidden"></p>
        </div>
      </div>

      <!-- Game Over -->
      <div id="game-over-screen" class="screen hidden">
        <div class="panel">
          <span id="record-badge" class="badge hidden">★ НОВЫЙ РЕКОРД ★</span>
          <h1 id="gameover-title">ИНТЕРНЕТ ВСЁ</h1>
          <p id="death-line" class="death"></p>
          <p id="final-score" class="final"></p>
          <p id="rank-display-over" class="rank-line"></p>
          <div class="gameover-actions">
            <button id="btn-restart" class="btn primary">ЕЩЁ РАЗ</button>
            <button id="btn-share" class="btn">ПОХВАСТАТЬСЯ</button>
            <button id="btn-uboost" class="btn cta">ВКЛЮЧИТЬ ЮБУСТ</button>
          </div>
          <div id="card-preview" class="card-preview"></div>
          <div id="stats">
            <p class="stats-head">Ты пережил:</p>
            <ul id="stats-list"></ul>
          </div>
          <div id="missions-block">
            <p id="missions-title" class="stats-head"></p>
            <ul id="missions-list"></ul>
            <p id="missions-bonus" class="missions-bonus hidden"></p>
          </div>
          <div id="badges-toast"></div>
        </div>
      </div>

      <!-- Пауза -->
      <div id="pause-screen" class="screen hidden">
        <div class="panel">
          <h1 id="pause-title">ПАУЗА</h1>
          <p id="pause-mission-preview" class="mission-preview"></p>
          <div id="pause-countdown" class="countdown hidden"></div>
          <button id="btn-resume" class="btn primary">ПРОДОЛЖИТЬ</button>
          <button id="btn-pause-settings" class="btn">⚙ НАСТРОЙКИ</button>
        </div>
      </div>

      <!-- Настройки -->
      <div id="settings-screen" class="screen hidden">
        <div class="panel">
          <h1 id="settings-title">НАСТРОЙКИ</h1>
          <div class="setting-row">
            <span class="setting-label" id="set-sound-label">Звук</span>
            <button id="set-sound" class="btn toggle">ВКЛ</button>
          </div>
          <div class="setting-row">
            <span class="setting-label" id="set-motion-label">Анимации</span>
            <button id="set-motion" class="btn toggle">АВТО</button>
          </div>
          <div class="setting-row">
            <span class="setting-label" id="set-colorassist-label">Дальтоник-режим</span>
            <button id="set-colorassist" class="btn toggle">ВЫКЛ</button>
          </div>
          <div class="setting-row">
            <span class="setting-label" id="set-swipe-label">Чувствительность свайпа</span>
            <button id="set-swipe" class="btn toggle">ОБЫЧНАЯ</button>
          </div>
          <div class="setting-row">
            <span class="setting-label" id="set-scale-label">Размер интерфейса</span>
            <button id="set-scale" class="btn toggle">ОБЫЧНЫЙ</button>
          </div>
          <button id="btn-settings-close" class="btn primary">НАЗАД</button>
        </div>
      </div>

      <!-- FTUE: подсказки первого забега -->
      <div id="tutorial-overlay" class="hidden"></div>

      <!-- HUD -->
      <div id="hud" class="hidden">
        <div class="hud-top">
          <span id="score-display">0</span>
          <div class="hud-right">
            <span id="dist-display">0 м</span>
            <div id="lives-display"></div>
          </div>
        </div>
        <div id="combo-display"></div>
        <div id="mult-display" class="hidden">×2</div>
        <div id="boost-indicator" class="hidden">
          <span class="boost-label">⚡ ВПН БУСТ</span>
          <div class="boost-track"><div id="boost-bar"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
