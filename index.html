<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ЮБуст Раннер — лети по рунету</title>

  <!-- OG / превью при шеринге ссылки. og:image обязателен: без него Telegram
       разворачивает challenge-ссылку без картинки и теряется главный виральный
       крючок. URL абсолютный (Telegram/соцсети не резолвят относительные пути). -->
  <meta property="og:title" content="ЮБуст Раннер">
  <meta property="og:description" content="Уворачивайся от блокировок, капч и рекламы, набей рекорд и сравни с настоящим VPN.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://deprav1.github.io/uboost-runner/">
  <meta property="og:image" content="https://deprav1.github.io/uboost-runner/preview/share-card.png">
  <meta property="og:image:width" content="1080">
  <meta property="og:image:height" content="1080">
  <meta property="og:image:alt" content="ЮБуст Раннер — синтвейв-забег по рунету">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#000000">

  <!-- Фирменный шрифт Open Runde — self-hosted, без внешнего CDN (надёжнее в Telegram
       WebApp и без сетевой зависимости от Google Fonts). Префетчим ходовые веса. -->
  <link rel="preload" href="assets/fonts/OpenRunde-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/OpenRunde-Semibold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/style.css?v=panel-audit-1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <button id="btn-mute" aria-label="Звук">🔊</button>
    <button id="btn-pause" class="hidden" aria-label="Пауза">⏸</button>
    <button id="btn-settings" aria-label="Настройки">⚙</button>
    <button id="btn-dashboard" aria-label="Доска почёта">🏆</button>

    <div id="ui-layer">
      <!-- Старт -->
      <div id="start-screen" class="screen">
        <video class="start-bg-video" poster="assets/start/start-bg-wide.webp" muted loop playsinline preload="metadata" aria-hidden="true">
          <source src="assets/start/start-bg-video.mp4" type="video/mp4">
        </video>
        <div class="panel start-panel-compact">
          <div class="logo"><span class="logo-mark">u</span><span class="logo-word">ЮБуст</span></div>
          <h1 id="title" class="glitch">ЮБУСТ РАННЕР</h1>
          <p id="tagline" class="tagline"></p>
          <p id="challenge-banner" class="challenge hidden" aria-live="polite"></p>
          <p id="mission-preview" class="mission-preview hidden"></p>
          <p id="howto" class="hint hint-pre hidden"></p>
          <button id="btn-start" class="btn primary">ПОЕХАЛИ</button>
          <button id="btn-start-board" class="btn ghost start-board-btn">🏆 ДОСКА ПОЧЁТА</button>
          <p id="privacy-note" class="privacy-note hidden"></p>
          <p id="rank-display" class="rank-line rank-line-start hidden"></p>
          <p id="best-display" class="rank-line rank-line-start hidden"></p>
        </div>
      </div>

      <!-- Game Over -->
      <div id="game-over-screen" class="screen hidden">
        <div class="panel gameover-panel-compact">
          <span id="record-badge" class="badge hidden">★ НОВЫЙ РЕКОРД ★</span>
          <h1 id="gameover-title">ИНТЕРНЕТ ВСЁ</h1>
          <p id="death-line" class="death hidden"></p>
          <p id="final-score" class="final"></p>
          <div class="gameover-actions">
            <button id="btn-restart" class="btn primary">ЕЩЁ РАЗ</button>
            <button id="btn-share" class="btn">ПОХВАСТАТЬСЯ</button>
            <button id="btn-uboost" class="btn cta">ВКЛЮЧИТЬ ЮБУСТ</button>
            <!-- Промокод: показывается только когда CONFIG.PROMO.code задан -->
            <div id="promo-block" class="promo-block hidden">
              <span id="promo-label" class="promo-label"></span>
              <button id="promo-code" class="promo-code"></button>
            </div>
          </div>
          <!-- После серверного сохранения показываем место и заметный путь к
               топ-5, не превращая компактный game-over в длинную таблицу. -->
          <div id="over-board" class="over-board hidden" aria-hidden="true">
            <div class="over-board-summary">
              <p id="over-board-title" class="stats-head"></p>
              <p id="over-board-place" class="over-board-place"></p>
            </div>
            <button id="btn-over-board" class="btn ghost"></button>
          </div>
          <button id="btn-run-details" class="btn ghost run-details-toggle" aria-expanded="false"></button>
          <div id="run-details" class="run-details hidden">
            <p id="rank-display-over" class="rank-line"></p>
            <div id="stats">
              <p class="stats-head">Ты пережил:</p>
              <ul id="stats-list"></ul>
            </div>
            <div id="missions-block">
              <p id="missions-title" class="stats-head"></p>
              <ul id="missions-list"></ul>
              <p id="missions-bonus" class="missions-bonus hidden"></p>
            </div>
            <div id="badges-toast"></div>
          </div>
          <div id="card-preview" class="card-preview hidden"></div>
        </div>
      </div>

      <!-- Пауза -->
      <div id="pause-screen" class="screen hidden">
        <div class="panel">
          <h1 id="pause-title">ПАУЗА</h1>
          <p id="pause-mission-preview" class="mission-preview"></p>
          <div id="pause-countdown" class="countdown hidden"></div>
          <button id="btn-resume" class="btn primary">ПРОДОЛЖИТЬ</button>
          <button id="btn-pause-settings" class="btn">⚙ НАСТРОЙКИ</button>
        </div>
      </div>

      <!-- Настройки -->
      <div id="settings-screen" class="screen hidden">
        <div class="panel">
          <h1 id="settings-title">НАСТРОЙКИ</h1>
          <div class="setting-row">
            <span class="setting-label" id="set-sound-label">Звук</span>
            <button id="set-sound" class="btn toggle">ВКЛ</button>
          </div>
          <div class="setting-row">
            <span class="setting-label" id="set-motion-label">Анимации</span>
            <button id="set-motion" class="btn toggle">АВТО</button>
          </div>
          <div class="setting-row">
            <span class="setting-label" id="set-colorassist-label">Дальтоник-режим</span>
            <button id="set-colorassist" class="btn toggle">ВЫКЛ</button>
          </div>
          <div class="setting-row">
            <span class="setting-label" id="set-swipe-label">Чувствительность свайпа</span>
            <button id="set-swipe" class="btn toggle">ОБЫЧНАЯ</button>
          </div>
          <div class="setting-row">
            <span class="setting-label" id="set-scale-label">Размер интерфейса</span>
            <button id="set-scale" class="btn toggle">ОБЫЧНЫЙ</button>
          </div>
          <button id="btn-settings-close" class="btn primary">НАЗАД</button>
        </div>
      </div>

      <!-- Прогресс и рейтинг. При отсутствии endpoint показывает честный
           локальный срез, а не выдаёт личные данные за глобальные. -->
      <div id="dashboard-screen" class="screen hidden">
        <div class="panel dashboard-panel">
          <h1 id="dashboard-title">ДОСКА ПОЧЁТА</h1>
          <p id="dashboard-subtitle" class="dashboard-subtitle"></p>
          <div id="dashboard-metrics" class="dashboard-metrics"></div>
          <div class="name-row">
            <input id="player-name" class="name-input" type="text" maxlength="16"
                   autocomplete="off" spellcheck="false" placeholder="Твоё имя на доске">
            <span id="player-name-status" class="name-status"></span>
          </div>
          <!-- Статус Telegram: игра — Mini App, игрок опознаётся подписанным
               initData и регистрируется для призов сам. Кода привязки нет.
               Блок виден, только когда на сервере включён бот (BOT_TOKEN):
               либо «привязан @username», либо «играй из бота» + ссылка. -->
          <div id="tg-link" class="tg-link hidden">
            <p id="tg-link-status" class="tg-link-status"></p>
            <a id="tg-link-open" class="btn ghost hidden" target="_blank" rel="noopener"></a>
          </div>
          <div class="leaderboard-head">
            <p id="leaderboard-title" class="stats-head"></p>
            <div class="board-tabs">
              <button id="board-tab-week" class="btn toggle tab-btn">НЕДЕЛЯ</button>
              <button id="board-tab-all" class="btn toggle tab-btn">ВСЁ ВРЕМЯ</button>
              <button id="board-tab-total" class="btn toggle tab-btn">ПРОБЕГ</button>
            </div>
            <button id="btn-leaderboard-refresh" class="icon-action" aria-label="Обновить рейтинг">↻</button>
          </div>
          <ol id="leaderboard-list" class="leaderboard-list"></ol>
          <button id="btn-leaderboard-more" class="btn ghost leaderboard-more hidden"></button>
          <p id="leaderboard-me" class="over-board-place"></p>
          <!-- Правило призов: значок ✓ на доске сам по себе непрозрачен,
               без подписи игрок не поймёт, почему его рекорд не участвует. -->
          <p id="leaderboard-rule" class="leaderboard-rule hidden"></p>
          <p id="leaderboard-status" class="dashboard-status"></p>
          <button id="btn-dashboard-close" class="btn primary">НАЗАД</button>
        </div>
      </div>

      <!-- FTUE: подсказки первого забега -->
      <div id="tutorial-overlay" class="hidden"></div>

      <!-- HUD -->
      <div id="hud" class="hidden">
        <div class="hud-top">
          <span id="score-display">0</span>
          <div class="hud-right">
            <span id="dist-display">0 м</span>
            <div id="lives-display"></div>
          </div>
        </div>
        <div id="combo-display"></div>
        <div id="mult-display" class="hidden">×2</div>
        <div id="boost-indicator" class="hidden">
          <span class="boost-label">⚡ ВПН БУСТ</span>
          <div class="boost-track"><div id="boost-bar"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
